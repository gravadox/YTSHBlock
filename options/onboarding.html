<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Welcome to YTSHBlock</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { height: 100%; }
    .page { height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px; flex-shrink: 0;
    }
    .topbar-logo { display: flex; align-items: center; gap: 9px; }
    .topbar-logo span { font-weight: 700; font-size: 14.5px; letter-spacing: -.02em; }

    .step-body {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      display: grid; place-items: safe center;
      padding: 10px 28px 24px;
    }
    .step-content { width: 100%; max-width: 460px; animation: fadeUp .28s var(--ease) both; }

    .footer {
      flex-shrink: 0; border-top: 1px solid var(--border);
      padding: 18px 28px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot-pip { height: 7px; border-radius: 999px; background: var(--track); transition: all .25s var(--ease); }
    .dot-pip.active   { background: var(--on-bg); width: 22px; }
    .dot-pip.inactive { width: 7px; }

    /* Step 1 — Welcome */
    .welcome { text-align: center; }
    .welcome-logo {
      width: 92px; height: 92px; margin: 8px auto 28px; border-radius: 26px;
      display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .welcome h1 { font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin: 0 0 14px; }
    .welcome p  { font-size: 15px; color: var(--text-2); line-height: 1.55; margin: 0 auto; max-width: 380px; }

    /* Step 2 */
    .choose h1 { font-size: 25px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 8px; text-align: center; }
    .choose p  { font-size: 14px; color: var(--text-2); line-height: 1.5; margin: 0 auto 24px; max-width: 360px; text-align: center; }

    /* Step 3 — Stats */
    .stats-opt h1  { font-size: 25px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 10px; text-align: center; }
    .stats-opt .sub { font-size: 14px; color: var(--text-2); line-height: 1.5; margin: 0 auto 28px; max-width: 360px; text-align: center; }
    .opt-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt-card {
      padding: 20px; border-radius: 14px; cursor: pointer;
      border: 2px solid var(--border); background: var(--surface);
      display: flex; flex-direction: column; gap: 10px;
      transition: all .16s var(--ease);
    }
    .opt-card:hover { border-color: var(--border-2); background: var(--surface-2); }
    .opt-card.selected { border-color: var(--on-bg); }
    .opt-card .oc-icon  { color: var(--text-2); }
    .opt-card.selected .oc-icon { color: var(--text); }
    .opt-card .oc-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
    .opt-card .oc-desc  { font-size: 12.5px; color: var(--text-2); line-height: 1.4; }

    /* Step 4 — Done */
    .done { text-align: center; }
    .done-check {
      width: 80px; height: 80px; margin: 8px auto 24px; border-radius: 999px;
      display: grid; place-items: center;
      background: var(--on-bg); color: var(--on-fg); box-shadow: var(--shadow);
    }
    .done h1 { font-size: 27px; font-weight: 700; letter-spacing: -.03em; margin: 0 0 12px; }
    .done p  { font-size: 15px; color: var(--text-2); line-height: 1.55; margin: 0 auto 26px; max-width: 360px; }
    .done-hint { padding: 14px 18px; display: flex; align-items: center; gap: 12px; max-width: 320px; margin: 0 auto; text-align: left; }
    .done-hint p { font-size: 12.5px; color: var(--text-2); line-height: 1.4; margin: 0; }
  </style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="topbar-logo">
      <img src="../icons/icon-48.png" width="22" height="22" style="border-radius:5px" alt="">
      <span>YTSHBlock</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn ghost" id="themeBtn" style="padding:8px;border-radius:9px" title="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
      <button class="btn ghost" id="skipBtn" style="font-size:12.5px;color:var(--text-3)">Skip</button>
    </div>
  </div>

  <div class="step-body scroll">
    <div class="step-content" id="stepContent"></div>
  </div>

  <div class="footer">
    <div class="dots" id="dots"></div>
    <div style="display:flex;gap:10px">
      <button class="btn" id="backBtn" style="display:none">Back</button>
      <button class="btn primary" id="nextBtn">Get started</button>
    </div>
  </div>

</div>

<!-- External script (required by MV3 CSP — no inline scripts) -->
<script src="onboarding.js"></script>
</body>
</html>
